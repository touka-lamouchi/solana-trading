# ── Network ──────────────────────────────────────────────
network:
  rpc_url: "https://devnet.helius-rpc.com/?api-key=ab3a9318-b88e-4b0b-9ec4-557047cc5db8"

  ws_url: "wss://devnet.helius-rpc.com/?api-key=ab3a9318-b88e-4b0b-9ec4-557047cc5db8"
  cluster: "devnet"               # devnet | mainnet-beta
  explorer_url: "https://explorer.solana.com"
  mainnet_rpc_url: "https://api.mainnet-beta.solana.com"   # read-only data RPC

# ── AI Data Source ───────────────────────────────────────
ai:
  data_source: "mainnet"          # devnet | mainnet  — where regime/GRU/whale features come from
  target_symbol: "SOL"
  target_mint_mainnet: "So11111111111111111111111111111111111111112"   # wSOL mainnet
  backfill_interval: "1h"
  backfill_candles: 24

binance:
  base_url: "https://api.binance.com"
  symbol: "SOLUSDT"
  interval: "1h"

pyth:
  sol_usd_account: "H6ARHf6YXhGYeQfUzQNGk6rDNnLBQKrenN712K4AQJEG"
  hermes_url: "https://hermes.pyth.network"
  sol_usd_feed_id: "ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d"

# ── Vault program ────────────────────────────────────────
# Program ID is shared across devnet/mainnet — same program, different clusters.
# Per-user PDA is derived from ("user_vault", user_pubkey) — no JSON file needed.
vault:
  program_id: "Gw6USbf98yEjLLFa9aTeNpQjAvRjuZ2576AVvu3B1g6H"
  base_mint: "fUSDC"   # which token in devnet_tokens.json to track as the deposit currency

# ── API security ─────────────────────────────────────────
# auth.enabled: false  → DEVNET BYPASS. Every user maps to the bot wallet and
#   ownership checks are skipped (keeps existing test scripts working).
# auth.enabled: true   → PRODUCTION. Requires SIWS + JWT; ownership enforced.
#   Also set the JWT_SECRET env var (>= 32 chars).
auth:
  enabled: false
  admin_pubkeys: []               # base58 pubkeys granted role=admin
  cors_origins:                   # allowed browser origins (used when enabled=true)
    - "http://localhost:5173"
  rate_limit:
    window_ms: 60000              # 1 minute
    max_requests: 120            # per IP per window (general)
    auth_max_requests: 10        # per IP per window (auth + start/stop)

# ── Services ─────────────────────────────────────────────
redis:
  host: "localhost"
  port: 6379

ai_server:
  host: "localhost"
  port: 8000

database:
  name: "trading_bot"
  host: "localhost"
  port: 5432

# ── Capital Limits ────────────────────────────────────────
capital:
  daily_limit_usd: 100            # max capital bot can deploy per day
  max_per_trade_usd: 20           # hard cap per single transaction
  flash_loan_max_usd: 500         # max flash loan size (no capital risk)

# ── Trading Hours (UTC) ───────────────────────────────────
trading_hours:
  enabled: false                  # false = trade 24/7
  start_utc: "08:00"
  end_utc: "22:00"

# ── Approval Mode ─────────────────────────────────────────
approval:
  fast_path: "auto"               # auto | manual
  slow_path: "manual"             # auto | manual  (own capital — manual by default)

# ── Protection Thresholds ─────────────────────────────────
protection:
  max_consecutive_failures: 5
  drawdown_pause_pct: 90          # pause at 90% of daily limit
  slippage_max_bps: 300           # 3% absolute max slippage (slow path)

# ── Fee Settings ──────────────────────────────────────────
fees:
  base_priority_fee_microlamports: 5000
  max_fee_pct_of_profit: 0.10     # cap priority fee at 10% of estimated profit
  compute_units_per_hop: 300000   # compute budget units per pool hop
  flash_loan_compute_units: 1000000

# ── AMM Settings ─────────────────────────────────────────
amm:
  fee_numerator: 997              # 0.3% fee: amount_in * 997 / 1000
  fee_denominator: 1000

# ── MEV Protection (Jito) ────────────────────────────────
jito:
  block_engine_url: "https://mainnet.block-engine.jito.wtf"
  tip_lamports: 1000
  max_poll_attempts: 10
  poll_interval_ms: 2000

# ── Sandwich Detection ───────────────────────────────────
sandwich_detection:
  min_suspicious_lamports: 100000000   # 0.1 SOL — flag front-runs above this

# ── Safety Filters ───────────────────────────────────────
safety:
  isolation_forest_threshold: 0.7      # anomaly score above this = suspicious
  max_dev_wallet_pct: 100              # devnet: we minted all tokens, wallet holds ~100%
                                       # mainnet: set this to 20% or lower
  min_unique_holders: 1                # minimum token holders to pass s4 check
  wash_trading_top2_threshold: 1.0     # devnet: we own all tokens, top 2 will always be >95%
                                       # mainnet: set this to 0.95

# ── News Feeds (no API keys required) ───────────────────
# Polls free sources: CoinDesk RSS, Cointelegraph RSS, GDELT 2.0 (geopolitics).
# Optional: set CRYPTOPANIC_TOKEN env var to also include CryptoPanic.
news:
  enabled: true
  poll_interval_crypto_ms: 60000        # CoinDesk + Cointelegraph + (optional) CryptoPanic
  poll_interval_geo_ms: 120000          # GDELT 2.0 + Reuters World fallback
  recency_decay_minutes: 60             # half-life for headline magnitude weighting
  crypto_weight: 0.7                    # blend in NewsSignal: cryptoScore vs geoScore
  geo_weight: 0.3
  geo_keywords:
    - "crypto regulation"
    - "sec crypto"
    - "fed rate"
    - "sanctions"
    - "etf approval"

# ── Whale Tracking ──────────────────────────────────────
whale_tracking:
  enabled: true
  scan_interval_ms: 60000              # scan every 60s (separate from 10s tick)
  min_whale_balance_pct: 5             # wallet must hold >= 5% of supply to be "whale"
  accumulation_threshold_pct: 5        # balance delta > +5% = accumulating
  distribution_threshold_pct: 5        # balance delta < -5% = distributing

lending:
  program_id: "AR6ubTCiWKJYbDaLXiXDWnXogaJCE3dqxpcqQEvUVp8f"
