version: 2

secret:
  # Solana public keys (base58, 32-44 chars) are NOT secrets — they are public addresses.
  # GitGuardian flags them as "Generic High Entropy Secret" because of high entropy.
  ignored-paths:
    - "config/devnet_tokens.json"
    - "config/devnet_pools.json"
    - "config/devnet_dirty_tokens.json"
    - "scripts/devnet/**"
    - "programs-amm/**"
    - "programs-protection/**"
    - "programs-vault/**"
    - "package-lock.json"

  ignored-matches:
    # Solana well-known program IDs
    - name: "Solana Token Program"
      match: "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
    - name: "Solana Associated Token Program"
      match: "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL"
    - name: "Solana Rent Sysvar"
      match: "SysvarRent111111111111111111111111111111111"
    - name: "AMM Program ID"
      match: "CzpMFPxKuL2qSXiZUGmYEdY6LSbD1zdmK25ZNpjukR9K"
    - name: "Flash Loan Program ID"
      match: "57qgGcR2anVG58VLymRe1vyui2eUjtefFPmsYFUN3acH"
    # Jito tip accounts (public, well-known)
